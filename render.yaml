services:
  - type: web
    name: skytrip
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skytrip-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: production

databases:
  - name: skytrip-db
    plan: free
    databaseName: skytrip
    user: skytrip
